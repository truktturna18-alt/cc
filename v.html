<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0d10;color:#e8e6e1;font:15px/1.45 system-ui,sans-serif;padding-bottom:40px}
#hdr{padding:14px 14px 8px;border-bottom:1px solid #1e232b;position:sticky;top:0;background:#0b0d10;z-index:5}
.brand{font:700 20px/1 Georgia,serif;letter-spacing:.14em;color:#d4af37}
.bal{font:700 26px/1.2 system-ui;color:#7ce38b;margin-top:6px}
.sub{font-size:11px;color:#6b7480;letter-spacing:.06em;text-transform:uppercase}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.t{background:#12161c;border:1px solid #1e232b;border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px;color:inherit;text-decoration:none;cursor:pointer}
.t:active{background:#2a3440}
.t .g{font-size:19px;color:#d4af37}.t .n{font-size:9.5px;text-align:center;color:#9aa3ad;line-height:1.15}
.t.hot{border-color:#5a3f10;background:#171208}
#panel{display:none;padding:0 12px}
#panel.on{display:block}
#grid.off{display:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin:10px 0;position:sticky;top:0;background:#0b0d10;padding:6px 0;border-bottom:1px solid #1e232b}
.mh b{font:700 13px/1 system-ui;letter-spacing:.12em;color:#d4af37;text-transform:uppercase}
.x{background:#1e232b;border:0;color:#e8e6e1;font-size:18px;width:36px;height:36px;border-radius:8px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.hint{font-size:11.5px;color:#6b7480;margin:8px 0}
</style></head><body>
<div id="hdr"><div class="brand">CHA CHING</div><div class="sub">cleared</div><div class="bal" id="bal">$0.00</div></div>
<div id="grid"></div>
<div id="panel"></div>
<script>["VAULT","🗄️","vault"],["STATEMENT","📄","statement"]
var TILES=[["ALARM","🔔","alarm"],["WALLET","💳","wallet"],["CHECKS","🧾","checks"],["CARD OPS","🔓","crack"],["DEPOSIT","🏧","dep"],["ASSETS","🏦","assets"],["ID FORGE","🪪","idf"],["CPN / EIN","#️⃣","cpn"],["SS-4","📠","ss4"],["WAR ROOM","⚔️","war"],["TRADELINES","📈","tl"],["BUREAU","🔍","bur"],["DISPUTE","⚖️","disp"],["ROUTER","🧭","router"],["INQUIRY","🛡️","inq"],["RUNBOOK","📋","run"],["AGENTS","🤖","agents"],["VAULT","🗄️","vault"]];
var g=document.getElementById("grid");
TILES.forEach(function(t){
  var a=document.createElement("a");
  a.className="t"+(t[2]==="crack"?" hot":"");
  a.href="#"+t[2];
  a.innerHTML='<span class="g">'+t[1]+'</span><span class="n">'+t[0]+'</span>';
  g.appendChild(a);
});
function route(){
  var k=location.hash.replace("#","");
  var p=document.getElementById("panel");
  if(!k){p.className="";p.innerHTML="";g.className="";return}
  var t=null;
  for(var i=0;i<TILES.length;i++)if(TILES[i][2]===k)t=TILES[i];
  g.className="off";p.className="on";
  p.innerHTML='<div class="mh"><b>'+(t?t[0]:k)+'</b><a class="x" href="#">✕</a></div><div id="body"><p class="hint" id="ph">loading...</p></div>';
  window.scrollTo(0,0);
  var s=document.createElement("script");
  s.src=k+".js?t="+Date.now();
  s.onload=function(){var q=document.getElementById("ph");if(q)q.textContent=""};
  s.onerror=function(){var q=document.getElementById("ph");if(q)q.textContent="module "+k+".js not built yet"};
  document.body.appendChild(s);
}
window.addEventListener("hashchange",route);
route();
</script></body></html>
